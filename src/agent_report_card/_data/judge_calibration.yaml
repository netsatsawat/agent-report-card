# The judge's own exam: 30 hand-labeled pairs, 15 pass / 15 fail.
#
# Every `run` report embeds the cached result of this exam for the judge in
# use; `agent-report-card judge-check` runs it. The five subtle_numeric
# pairs are wrong by under 1%: the class of error a judge misses most, the
# lesson imported from agent-failure-lab's verifier experiment. 30 items
# supports "measured error rate on this labeled set", never "calibrated".

pairs:
  # ---- correct paraphrases (label pass) ----
  - id: c01
    kind: correct
    category: paraphrase
    label: pass
    question: "What was postpaid churn in Q3 2025?"
    reference: "Postpaid churn was 3.2% in Q3 2025."
    candidate: "In the third quarter of 2025, 3.2% of postpaid customers churned."
  - id: c02
    kind: correct
    category: paraphrase
    label: pass
    question: "How many days of parental leave does the policy allow?"
    reference: "30 business days."
    candidate: "The policy grants thirty business days of paid parental leave."
  - id: c03
    kind: correct
    category: paraphrase
    label: pass
    question: "What is the daily cap on the Global Pass?"
    reference: "THB 349 per day."
    candidate: "Global Pass usage is capped at 349 baht each day."
  - id: c04
    kind: correct
    category: paraphrase
    label: pass
    question: "When does sick leave require a certificate?"
    reference: "Sick leave beyond 3 consecutive days requires a medical certificate."
    candidate: "You need a doctor's certificate once sick leave passes three days in a row."
  - id: c05
    kind: correct
    category: paraphrase
    label: pass
    question: "What are the loyalty tiers?"
    reference: "Three tiers: Silver, Gold, and Platinum."
    candidate: "The program has Silver, Gold and Platinum levels."

  # ---- verbose but correct (label pass) ----
  - id: c06
    kind: correct
    category: verbose
    label: pass
    question: "What interim dividend was declared for 2025?"
    reference: "THB 0.85 per share."
    candidate: "The board, at its August meeting and consistent with the
      long-standing payout policy of distributing at least half of net
      profit, declared an interim dividend of THB 0.85 per share for 2025,
      payable in October."
  - id: c07
    kind: correct
    category: verbose
    label: pass
    question: "How quickly is fiber installed?"
    reference: "Within 5 business days of a confirmed order."
    candidate: "Installation timelines have improved every quarter, and a
      confirmed fiber order is now completed within 5 business days, with
      same-week appointments available in metropolitan areas."
  - id: c08
    kind: correct
    category: verbose
    label: pass
    question: "What share of the population does the 5G network cover?"
    reference: "87% of the population."
    candidate: "Following the July densification program the 5G footprint
      reached 87% population coverage, which also earned the network a
      measured-speed award in metropolitan areas."

  # ---- exact equivalents (label pass) ----
  - id: c09
    kind: correct
    category: paraphrase
    label: pass
    question: "How many retail stores were open at quarter end?"
    reference: "214 stores."
    candidate: "214"
  - id: c10
    kind: correct
    category: paraphrase
    label: pass
    question: "What was blended ARPU in Q3 2025?"
    reference: "THB 412."
    candidate: "Blended ARPU came in at THB 412."

  # ---- clearly wrong (label fail) ----
  - id: c11
    kind: correct
    category: wrong
    label: fail
    question: "What was postpaid churn in Q3 2025?"
    reference: "Postpaid churn was 3.2% in Q3 2025."
    candidate: "Postpaid churn was 4.1% in Q3 2025."
  - id: c12
