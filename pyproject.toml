[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-report-card"
version = "0.1.0"
description = "A performance review for your AI agent: one CLI, one YAML test file, one markdown report."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Satsawat Natakarnkitkul" }]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "httpx>=0.27"]
keywords = ["evaluation", "rag", "llm", "testing", "report"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/netsatsawat/agent-report-card"

[project.scripts]
agent-report-card = "agent_report_card.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_report_card = ["_data/*.yaml", "_data/corpus/*.md"]
