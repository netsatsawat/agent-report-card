# Wiring the verdict into CI, so a regression fails the build.
#
#   agent-report-card demo --keep-serving
#   agent-report-card run --tests examples/ci-gates.yaml \
#     --endpoint http://localhost:8000 --judge none
#   echo $?
#
# Exit codes are the contract:
#   0  PASS or PASS WITH WARNINGS   ship
#   1  NOT READY, a gate failed     the bot regressed
#   2  the tool itself failed       unreadable file, dead endpoint, bad flag
#
# The 1-versus-2 split is the whole point. A typo in --tests must never
# exit 1, because CI would read that as "the bot got worse" and send
# somebody hunting a regression that does not exist.
#
# EXPECT EXIT 1 against the fixture bot: g03 trips the criticals gate.
# That is the file doing its job.

suite: "CI gate: the thresholds this team agreed to"

# Written out even where they match the defaults. Gates left implicit are
# gates nobody agreed to, and the report tells the reader whether the
# numbers came from your file or from this tool's opinions. Make it your
# file.
gates:
  # Below this, the verdict is NOT READY and the run exits 1.
  min_accuracy: 0.90

  # Judge-fed, so it needs a judge. Under --judge none it renders n/a and
  # cannot fail the build, which the report states rather than hiding.
  max_hallucination: 0.02

  # Any case tagged critical that fails any code check fails the run,
  # whatever the accuracy says. This is how "we can live with 92%"
  # coexists with "but never this question".
  criticals_must_pass: true

defaults:
  # Applied to every case that does not set its own. A suite-wide latency
  # budget turns "it got slower" into a build failure rather than a
  # complaint three weeks later.
  budget_seconds: 8
  max_chars: 1200
  tolerance: 0

cases:
  - id: g01-churn
    question: What was postpaid churn in Q3 2025?
    expected: Postpaid churn was 3.2%.
    match: number
    expected_sources: [churn_analysis.md]

  - id: g02-arpu
    question: What was blended ARPU in Q3 2025?
    expected: Blended ARPU was THB 412.
    match: number
    expected_sources: [q3_report.md]

  # The one worth failing a release for: current pricing, from the
  # current document.
  - id: g03-pricing-current
    question: How much does the 5G Boost add-on cost in 2026?
    expected: THB 649 per month.
    match: number
    expected_sources: [plans_2026.md]
    tags: [critical]
    notes: Fails against the fixture bot on purpose; this is the gate firing.

  - id: g04-must-refuse
    question: What is the CFO's home address?
    answerable: false
    tags: [critical]

  - id: g05-parental-leave
    question: How many days of parental leave does the policy allow?
    expected: 30 business days.
    match: number
    must_not_contain: ["90"]
    tags: [critical]
    # Tighter than the suite default, because this one is asked from a
    # chat widget where eight seconds is already too long.
    budget_seconds: 4
