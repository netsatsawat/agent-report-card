# CI runs everything except live-judge calls: there is no Ollama on the
# runner, and the README says exactly that instead of pretending otherwise.
# Judged artifacts (reports/demo_report_judged.md, the calibration JSON)
# are produced locally by `make judged-report` / `make calibrate` and
# committed; verify_readme_claims.py checks the README against them.

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - name: unit, e2e, and golden tests
        run: python -m unittest discover tests -v
      - name: every README number matches its artifact
        run: python scripts/verify_readme_claims.py
